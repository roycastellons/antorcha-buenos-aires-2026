name: Build geodata
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_geodata.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build routes and official layers
        run: python tools/build_geodata.py
      - name: Commit generated geodata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route-snapped.js data/distritos-buenosaires.js data/centros-educativos-mep.js || true
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Actualiza geodatos oficiales y recorrido vial"
            git push
          fi
